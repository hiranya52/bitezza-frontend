<div
  class="w-96 flex flex-col border-l border-gray-200 dark:border-gray-800 bg-white dark:bg-zinc-900 sticky top-0 h-screen"
>
  <!-- HEADER -->
  <div
    class="p-6 border-b border-gray-100 dark:border-zinc-800 flex items-center justify-between"
  >
    <div>
      <h2 class="text-xl font-bold">Current Cart</h2>
      <p class="text-xs text-gray-400 font-medium">Order #BIT-10492</p>
    </div>

    <button
      class="text-primary text-sm font-bold flex items-center gap-1 hover:underline"
      (click)="clearAll()"
    >
      <span class="material-symbols-outlined text-sm">delete</span>
      Clear All
    </button>
  </div>

  <!-- SERVICE TYPE -->
  <div class="p-6 pt-4">
    <div
      class="bg-gray-100 dark:bg-zinc-800/50 p-1.5 rounded-xl flex items-center gap-1"
    >
      <button
        (click)="setServiceType('Dine In')"
        [ngClass]="
          activeServiceType === 'Dine In'
            ? 'service-type-active text-black'
            : 'text-gray-400 hover:text-gray-600 dark:hover:text-gray-200'
        "
        class="flex-1 service-type-active py-2.5 rounded-[10px] flex flex-col items-center justify-center transition-all"
      >
        <span class="material-symbols-outlined text-xl">restaurant</span>
        <span class="text-[10px] font-bold uppercase mt-0.5 tracking-wider"
          >Dine In</span
        >
      </button>

      <button
        (click)="setServiceType('Takeaway')"
        [ngClass]="
          activeServiceType === 'Takeaway'
            ? 'service-type-active text-black'
            : 'text-gray-400 hover:text-gray-600 dark:hover:text-gray-200'
        "
        class="flex-1 py-2.5 rounded-[10px] flex flex-col items-center justify-center transition-all text-gray-400 hover:text-gray-600 dark:hover:text-gray-200"
      >
        <span class="material-symbols-outlined text-xl">takeout_dining</span>
        <span class="text-[10px] font-bold uppercase mt-0.5 tracking-wider"
          >Takeaway</span
        >
      </button>

      <button
        (click)="setServiceType('Delivery')"
        [ngClass]="
          activeServiceType === 'Delivery'
            ? 'service-type-active text-black'
            : 'text-gray-400 hover:text-gray-600 dark:hover:text-gray-200'
        "
        class="flex-1 py-2.5 rounded-[10px] flex flex-col items-center justify-center transition-all text-gray-400 hover:text-gray-600 dark:hover:text-gray-200"
      >
        <span class="material-symbols-outlined text-xl">delivery_dining</span>
        <span class="text-[10px] font-bold uppercase mt-0.5 tracking-wider"
          >Delivery</span
        >
      </button>
    </div>
  </div>

  <!-- CART ITEMS (SCROLL AREA) -->
  <div class="flex-1 overflow-y-auto px-6 py-4 space-y-4">
    @for (item of cartProductList; track $index) {
      <app-cart-item [product]="item"></app-cart-item>
    }

    @if (cartProductList.length === 0) {
      <div class="pt-8 text-center opacity-30">
        <span class="material-symbols-outlined text-6xl">shopping_cart</span>
        <p class="text-xs mt-2 font-medium">Add more delicious items</p>
      </div>
    }
  </div>

  <!-- TOTALS / FOOTER -->
  <div
    class="p-6 bg-white dark:bg-zinc-900 border-t border-gray-100 dark:border-zinc-800 shadow-[0_-10px_30px_rgba(0,0,0,0.03)]"
  >
    <div class="space-y-3 mb-6">
      <div class="flex justify-between text-gray-500 text-sm font-medium">
        <span>Subtotal</span>
        <span>LKR {{ getSubTotal() }}</span>
      </div>

      <div class="flex justify-between text-gray-500 text-sm font-medium">
        <span>Service Fee (5%)</span>
        <span>LKR {{ getServiceFee() }}</span>
      </div>

      <div
        class="flex justify-between items-center pt-3 border-t border-dashed border-gray-200 dark:border-zinc-700"
      >
        <span class="text-lg font-bold">Total Payable</span>
        <span class="text-2xl font-bold text-primary">
          LKR {{ getTotalPayable() }}
        </span>
      </div>
    </div>

    <div class="flex flex-col gap-3">
      <div class="flex gap-2">
        <button
          class="flex-1 bg-gray-100 dark:bg-zinc-800 hover:bg-gray-200 py-4 rounded-xl font-bold text-sm transition-all flex items-center justify-center gap-2"
        >
          <span class="material-symbols-outlined text-xl">
            confirmation_number
          </span>
          Voucher
        </button>

        <button
          class="flex-1 bg-gray-100 dark:bg-zinc-800 hover:bg-gray-200 py-4 rounded-xl font-bold text-sm transition-all flex items-center justify-center gap-2"
        >
          <span class="material-symbols-outlined text-xl">loyalty</span>
          Points
        </button>
      </div>

      <button
        class="w-full bg-primary hover:bg-primary/90 text-white py-5 rounded-xl font-bold text-lg shadow-lg shadow-primary/30 transition-all hover:scale-[1.02] flex items-center justify-center gap-3"
        (click)="addOrder()"
      >
        Confirm Order
        <span class="material-symbols-outlined">chevron_right</span>
      </button>
    </div>
  </div>
</div>
