<div
  class="flex items-center gap-3 bg-gray-50 dark:bg-zinc-800/50 p-2 rounded-xl border border-transparent hover:border-primary/20 transition-all mb-4"
>
  <div class="size-11 rounded-lg overflow-hidden shrink-0">
    <img class="w-full h-full object-cover" data-alt="Thumbnail of classic beef burger"
      src="{{ product.imageURL }}"
    />
  </div>
  <div class="flex-1 min-w-0">
    <h4 class="text-[13px] font-bold truncate leading-tight">{{ product.name }}</h4>
    <p class="text-[11px] text-primary font-bold">LKR {{ product.price }}</p>
  </div>
  <div class="flex items-center gap-2 shrink-0">
    <div
      class="flex items-center bg-white dark:bg-zinc-900 rounded-lg px-1 py-0.5 border border-gray-200 dark:border-zinc-700 shadow-sm scale-90"
    >
      <button class="size-5 flex items-center justify-center hover:text-primary transition-colors"
        (click)="decreaseQty()" >
        <span class="material-symbols-outlined text-[16px]">remove</span>
      </button>

      <span class="w-5 text-center text-[12px] font-bold">{{ product.qty }}</span>

      <button
        class="size-5 flex items-center justify-center hover:text-primary transition-colors"
        (click)="increaseQty()" >
        <span class="material-symbols-outlined text-[16px]">add</span>
      </button>

    </div>

    <button
      class="size-6 rounded flex items-center justify-center text-gray-300 hover:text-red-500 transition-all"
      >
      <span class="material-symbols-outlined text-[18px]">delete</span>
    </button>
  </div>
</div>
