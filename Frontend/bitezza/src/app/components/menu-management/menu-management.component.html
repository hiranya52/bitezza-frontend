<aside
  class="w-64 border-r border-[#e6dfdb] dark:border-[#3d2b1f] bg-white dark:bg-[#2a1d14] flex flex-col fixed h-full">
  <!-- Slide-out Panel (Add Product) -->
  <div class="fixed inset-0 bg-black/30 backdrop-blur-sm z-50 flex justify-end">
    <div class="w-[450px] bg-white dark:bg-[#2a1d14] h-full shadow-2xl flex flex-col">
      <div class="p-6 border-b border-[#e6dfdb] dark:border-[#3d2b1f] flex items-center justify-between">
        <h3 class="text-xl font-bold">Add New Product</h3>
        <button class="p-2 hover:bg-background-light rounded-full transition-colors">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
      <div class="flex-1 overflow-auto p-8 space-y-6">
        <!-- Image Upload -->
        <div class="space-y-2">
          <label class="text-sm font-bold block">Product Image</label>
          <div
            class="border-2 border-dashed border-[#e6dfdb] dark:border-[#3d2b1f] rounded-2xl p-8 flex flex-col items-center justify-center gap-2 hover:border-primary/50 transition-colors cursor-pointer group">
            <div
              class="w-12 h-12 rounded-full bg-background-light dark:bg-[#3d2b1f] flex items-center justify-center text-[#8a7260] group-hover:bg-primary/10 group-hover:text-primary transition-colors">
              <span class="material-symbols-outlined">upload</span>
            </div>
            <p class="text-sm font-semibold">Click to upload or drag &amp; drop</p>
            <p class="text-xs text-[#8a7260]">SVG, PNG, JPG or GIF (max. 2MB)</p>
          </div>
        </div>
        <!-- Form Fields -->
        <div class="space-y-4">
          <div class="space-y-2">
            <label class="text-sm font-bold block">Product Name</label>
            <input
              class="w-full bg-background-light dark:bg-[#3d2b1f] border-none rounded-xl px-4 py-3 focus:ring-2 focus:ring-primary/50"
              placeholder="e.g. Spicy Zinger" type="text" />
          </div>
          <div class="grid grid-cols-2 gap-4">
            <div class="space-y-2">
              <label class="text-sm font-bold block">Category</label>
              <select
                class="w-full bg-background-light dark:bg-[#3d2b1f] border-none rounded-xl px-4 py-3 focus:ring-2 focus:ring-primary/50 appearance-none">
                <option>Burgers</option>
                <option>Sides</option>
                <option>Drinks</option>
                <option>Desserts</option>
              </select>
            </div>
            <div class="space-y-2">
              <label class="text-sm font-bold block">Price ($)</label>
              <input
                class="w-full bg-background-light dark:bg-[#3d2b1f] border-none rounded-xl px-4 py-3 focus:ring-2 focus:ring-primary/50"
                placeholder="0.00" step="0.01" type="number" />
            </div>
          </div>
          <div class="space-y-2">
            <label class="text-sm font-bold block">Description</label>
            <textarea
              class="w-full bg-background-light dark:bg-[#3d2b1f] border-none rounded-xl px-4 py-3 focus:ring-2 focus:ring-primary/50 resize-none"
              placeholder="Briefly describe the ingredients and taste..." rows="4"></textarea>
          </div>
          <div class="space-y-2">
            <label class="text-sm font-bold block">Availability</label>
            <div class="flex items-center gap-6">
              <label class="flex items-center gap-2 cursor-pointer">
                <input checked="" class="text-primary focus:ring-primary size-5 border-none bg-background-light"
                  name="stock" type="radio" />
                <span class="text-sm font-medium">In Stock</span>
              </label>
              <label class="flex items-center gap-2 cursor-pointer">
                <input class="text-primary focus:ring-primary size-5 border-none bg-background-light" name="stock"
                  type="radio" />
                <span class="text-sm font-medium">Out of Stock</span>
              </label>
            </div>
          </div>
        </div>
      </div>
      <div
        class="p-8 border-t border-[#e6dfdb] dark:border-[#3d2b1f] bg-background-light/50 dark:bg-black/10 flex gap-4">
        <button
          class="flex-1 px-6 py-4 border border-[#e6dfdb] dark:border-[#3d2b1f] rounded-full font-bold text-sm hover:bg-white transition-colors">Cancel</button>
        <button
          class="flex-1 px-6 py-4 bg-primary text-white rounded-full font-bold text-sm hover:bg-primary/90 shadow-lg shadow-primary/20 transition-all">Save
          Product</button>
      </div>
    </div>
  </div>
</aside>
