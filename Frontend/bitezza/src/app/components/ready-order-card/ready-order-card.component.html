<div
  class="bg-green-50 dark:bg-green-900/10 p-5 rounded-xl border border-green-200 dark:border-green-900/30 transition-all group">
  <div class="flex justify-between items-start mb-3">
    <div class="flex flex-col">
      <h4 class="font-bold text-lg text-green-700 dark:text-green-400">
        Order #{{order.orderId}}
      </h4>
    </div>
    <div class="bg-green-200 text-green-800 px-2 py-1 rounded-full text-[10px] font-bold uppercase tracking-tight">
      {{order.serviceType}}
    </div>
  </div>
  <div class="mb-4">
    <p class="text-sm text-green-800/70 dark:text-green-400/70">
      <ng-container *ngFor="let item of order.items; let i = index">
        {{item.productName}}<span *ngIf="i < order.items.length - 1">,</span>
      </ng-container>
    </p>
  </div>
  <button
    class="w-full bg-green-500 hover:bg-green-600 text-white py-3 rounded-full text-sm font-bold shadow-lg shadow-green-500/20 transition-all flex items-center justify-center gap-2">
    <span class="material-symbols-outlined text-[20px]">task_alt</span>
    Complete Order
  </button>
</div>
