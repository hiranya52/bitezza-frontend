<div class="body bg-background-light dark:bg-background-dark min-h-screen flex overflow-hidden">
  <div class="flex w-full min-h-screen">

    <!-- Left Image -->
    <div class="hidden lg:block lg:w-1/2 xl:w-3/5 relative overflow-hidden">
      <img class="absolute inset-0 w-full h-full object-cover brightness-75"
        src="https://lh3.googleusercontent.com/aida-public/AB6AXuBE43v5RPbe_g76lpvwJN0o0c0vqiP8RZliMVvhvsoaNwBZD-aTj8JMSA_5lBpVkQNJ3p0i7wpR-pUIrPWQVe4e30WCBZ-O3qxTBBOLIGbOupKSsyj0HdEP5UM1n3TFOVZGmToP5OErMDw1FWSz_ZDB8e8izdnPWIa9e8Aj4IZGEDel_SkIch4XNzAEUdnhLsRHi0ca1a5Z3EwVZTH8zkkYb5Ux_zNVqGqz9uDMo4yqgfkE_VGHW9HvvRFX3AvyFua-Q8KqLEXnJXM"
        alt="Burger" />
      <div class="absolute bottom-16 left-16 text-white drop-shadow-2xl max-w-xl">
        <span
          class="inline-block px-4 py-1.5 bg-primary/90 rounded-full text-xs font-bold uppercase tracking-[0.2em] mb-4">Chef's
          Special</span>
        <h2 class="text-5xl font-extrabold mb-4 leading-tight">The Ultimate <br><span class="text-primary">Spicy
            Gourmet</span></h2>
        <p class="text-xl font-medium text-gray-200">Crafted with aged cheddar, signature spicy glaze, and toasted
          brioche.</p>
      </div>
    </div>

    <!-- Right Form Section -->
    <div class="w-full lg:w-1/2 xl:w-2/5 flex items-center justify-center px-6 py-10 bg-[#fdfdfd]">

      <!-- Form Card -->
      <div class="w-full max-w-sm bg-white rounded-3xl shadow-2xl p-8 border border-slate-200">

        <!-- Logo -->
        <div class="flex flex-col items-center mb-8">
          <div class="w-14 h-14 bg-primary rounded-xl flex items-center justify-center mb-4">
            <svg fill="#ffffff" width="38px" height="38px" viewBox="0 0 32 32" version="1.1" xmlns="http://www.w3.org/2000/svg" stroke="#ffffff"><g id="SVGRepo_bgCarrier" stroke-width="0"></g><g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round" stroke="#CCCCCC" stroke-width="0.384"></g><g id="SVGRepo_iconCarrier"> <title>bell</title> <path d="M2.272 25.152q0 1.888 1.856 3.456t4.992 2.496 6.88 0.896 6.88-0.896 4.992-2.496 1.856-3.456q0-2.016-2.304-3.776v-5.376q0-3.488-1.92-6.336t-5.024-4.16q0.096-0.448 0.096-0.928 0-1.888-1.344-3.232t-3.232-1.344-3.232 1.344-1.344 3.232q0 0.32 0.096 0.928-3.104 1.312-5.024 4.16t-1.92 6.336v5.376q-2.304 1.76-2.304 3.776zM6.848 25.152q0-1.248 1.248-2.304t3.328-1.664 4.576-0.608 4.576 0.608 3.328 1.664 1.248 2.304-1.248 2.304-3.328 1.664-4.576 0.608-4.576-0.608-3.328-1.664-1.248-2.304zM11.52 23.744q0.32 1.568 1.568 2.624t2.912 1.056 2.912-1.056 1.568-2.624q-1.952-0.864-4.48-0.864t-4.48 0.864z"></path> </g></svg>
          </div>
          <h1 class="text-2xl font-bold text-gray-900 dark:text-white">Bitezza</h1>
        </div>

        <!-- Form -->
        <form class="space-y-4" [formGroup]="userForm" (ngSubmit)="onSubmit()">

          <!-- Username -->
          <div>
            <label class="text-xs font-bold text-gray-500 uppercase">Username</label>
            <input type="text" placeholder="Employee ID or name" formControlName="username"
              class="w-full h-11 mt-1 px-4 rounded-lg border border-gray-200 dark:border-gray-700 bg-transparent outline-none focus:border-primary" />
          </div>

          <!-- Password -->
          <div>
            <label class="text-xs font-bold text-gray-500 uppercase">Password</label>
            <input type="password" placeholder="••••••••" formControlName="password"
              class="w-full h-11 mt-1 px-4 rounded-lg border border-gray-200 dark:border-gray-700 bg-transparent outline-none focus:border-primary" />
          </div>

          <!-- Login Button -->
          <button class="w-full h-11 bg-primary text-white font-semibold rounded-lg hover:bg-primary-dark transition"
            type="submit">
            Staff Login
          </button>

          <!-- Divider -->
          <div class="flex items-center gap-3 py-2">
            <div class="flex-1 h-[1px] bg-gray-200"></div>
            <span class="text-xs text-gray-400">OR</span>
            <div class="flex-1 h-[1px] bg-gray-200"></div>
          </div>

          <!-- PIN Button -->
          <button type="button" class="w-full h-11 border border-gray-200 rounded-lg hover:border-primary transition">
            Quick PIN Entry
          </button>

        </form>

      </div>

    </div>

  </div>
</div>
